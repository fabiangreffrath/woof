name: Build

on:
  push:
    branches: [ master ]
    tags: ['*']
    paths-ignore: ['**.md']
  pull_request:
    branches: [ master ]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: ${{ matrix.config.shell }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux x64
            os: ubuntu-latest
            shell: bash
            type: system
            extra-options: >-
              -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=OFF
              -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON

          - name: Linux cross arm64
            os: ubuntu-26.04
            shell: bash
            cross: true
            extra-options: >-
              -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/toolchains/linux-arm64.cmake
              -DWOOF_HOST_C_COMPILER=/usr/bin/gcc
              -DWITH_DISCORD_RPC=ON
              -DCMAKE_INSTALL_PREFIX=/usr
              -DCMAKE_INSTALL_RPATH=$GITHUB_WORKSPACE/sdl3_net-install/lib

          - name: macOS Clang
            os: macos-latest
            shell: bash
            type: system

          - name: MSYS2 UCRT64
            os: windows-2022
            shell: 'msys2 {0}'
            type: system
            msystem: ucrt64
            msys-env: mingw-w64-ucrt-x86_64
            artifact-name: MSYS2-UCRT64
            artifact-path: build/*.zip

          - name: macOS arm64 (vcpkg)
            os: macos-latest
            shell: bash
            type: vcpkg
            triplet: arm64-osx-release
            artifact-name: MacOS-arm64
            artifact-path: build/*.zip
            extra-options: >-
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
              -DVCPKG_TARGET_TRIPLET=arm64-osx-release
              -DWITH_DISCORD_RPC=ON
              -DCMAKE_INSTALL_PREFIX=/usr

          - name: macOS x64 (vcpkg)
            os: macos-latest
            shell: bash
            type: vcpkg
            cross: true
            triplet: x64-osx-release
            artifact-name: MacOS-x64
            artifact-path: build/*.zip
            extra-options: >-
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
              -DCMAKE_OSX_ARCHITECTURES=x86_64
              -DVCPKG_TARGET_TRIPLET=x64-osx-release
              -DWITH_DISCORD_RPC=ON
              -DCMAKE_INSTALL_PREFIX=/usr

          - name: Linux x64 (vcpkg)
            os: ubuntu-24.04
            shell: bash
            type: vcpkg
            triplet: x64-linux-release
            artifact-name: AppImage
            artifact-path: |-
              build/*.AppImage
              build/*.zsync
            extra-options: >-
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
              -DVCPKG_TARGET_TRIPLET=x64-linux-release
              -DWITH_DISCORD_RPC=ON
              -DCMAKE_INSTALL_PREFIX=/usr

          - name: MSVC x64 (vcpkg)
            os: windows-2022
            shell: pwsh
            type: vcpkg
            triplet: x64-windows-static-release
            arch: x64
            artifact-name: Win-64
            artifact-path: build/*.zip
            extra-options: >-
              -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake"
              -DVCPKG_TARGET_TRIPLET=x64-windows-static-release
              -DWITH_DISCORD_RPC=ON
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
              -DCMAKE_IGNORE_PATH="C:/Strawberry/perl/bin;C:/Strawberry/c/lib"

          - name: MSVC x86 (vcpkg)
            os: windows-2022
            shell: pwsh
            type: vcpkg
            triplet: x86-windows-static-release
            arch: x86
            artifact-name: Win-32
            artifact-path: build/*.zip
            extra-options: >-
              -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake"
              -DVCPKG_TARGET_TRIPLET=x86-windows-static-release
              -DWITH_DISCORD_RPC=ON
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
              -DCMAKE_IGNORE_PATH="C:/Strawberry/perl/bin;C:/Strawberry/c/lib"

    steps:
      - name: Developer Command Prompt (MSVC)
        if: runner.os == 'Windows' && matrix.config.type == 'vcpkg'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.config.arch }}

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux' && matrix.config.type == 'system'
        run: |
          sudo apt-get update
          sudo apt-get install \
            pandoc \
            ninja-build \
            libopenal-dev \
            libebur128-dev \
            libsndfile1-dev \
            libfluidsynth-dev \
            libxmp-dev

      - name: Enable arm64 packages (Linux)
        if: runner.os == 'Linux' && matrix.config.cross
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update

      - name: Install dependencies (Linux arm64)
        if: runner.os == 'Linux' && matrix.config.cross
        run: |
          sudo apt-get install \
            pandoc \
            ninja-build \
            crossbuild-essential-arm64 \
            libsdl3-dev:arm64 \
            libopenal-dev:arm64 \
            libebur128-dev:arm64 \
            libsndfile1-dev:arm64 \
            libfluidsynth-dev:arm64 \
            libxmp-dev:arm64

      - name: Install dependencies (Linux vcpkg)
        if: runner.os == 'Linux' && matrix.config.type == 'vcpkg'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autoconf-archive git make \
          pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
          libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
          libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev \
          libltdl-dev

      - name: Install CPack AppImage dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libfuse2 desktop-file-utils
          # Download appimagetool directly as it's not in the default repos
          sudo wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS' && matrix.config.type == 'system'
        run: |
          brew install \
            sdl3 \
            sdl3_net \
            openal-soft \
            libebur128 \
            libsndfile \
            fluid-synth \
            libxmp \
            yyjson \
            libspng

      - name: Install dependencies (MSYS2)
        if: matrix.config.shell == 'msys2 {0}'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.config.msystem }}
          update: true
          install: >-
            ${{ matrix.config.msys-env }}-gcc
            ${{ matrix.config.msys-env }}-cmake
            ${{ matrix.config.msys-env }}-ninja
            ${{ matrix.config.msys-env }}-python
            ${{ matrix.config.msys-env }}-sdl3
            ${{ matrix.config.msys-env }}-sdl3-net
            ${{ matrix.config.msys-env }}-openal
            ${{ matrix.config.msys-env }}-libebur128
            ${{ matrix.config.msys-env }}-libsndfile
            ${{ matrix.config.msys-env }}-fluidsynth
            ${{ matrix.config.msys-env }}-libxmp
            ${{ matrix.config.msys-env }}-libspng

      - uses: actions/checkout@v7

      - name: Build SDL3 (Linux)
        if: runner.os == 'Linux' && matrix.config.type == 'system'
        uses: libsdl-org/setup-sdl@main
        with:
          install-linux-dependencies: true
          version: 3-latest
          version-sdl-net: 3-latest

      - name: Build SDL3_net (Linux arm64)
        if: runner.os == 'Linux' && matrix.config.cross
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL_net.git sdl3_net-src
          cd sdl3_net-src

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/toolchains/linux-arm64.cmake \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/sdl3_net-install \
            -DSDLNET_SAMPLES=OFF \
            -DSDLNET_TESTS=OFF

          cmake --build build
          cmake --install build

      - name: Point CMake to the local SDL3_net install (Linux arm64)
        if: runner.os == 'Linux' && matrix.config.cross
        run: |
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/sdl3_net-install" >> $GITHUB_ENV

      - name: Restore vcpkg cache
        id: cache-vcpkg
        if: matrix.config.type == 'vcpkg'
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.config.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'overlay-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.config.triplet }}-

      - name: Configure
        run: >-
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_WERROR=ON -DENABLE_LTO=ON
          ${{ matrix.config.extra-options }}

      - name: Build
        run: cmake --build build

      - name: Delete old vcpkg cache
        continue-on-error: true
        if: matrix.config.type == 'vcpkg' && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.cache-vcpkg.outputs.cache-hit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete --repo ${{ github.repository }} ${{ steps.cache-vcpkg.outputs.cache-primary-key }}

      - name: Save vcpkg cache
        if: matrix.config.type == 'vcpkg' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: ${{ steps.cache-vcpkg.outputs.cache-primary-key }}

      - name: Restore demotest cache
        id: cache-demotest
        if: matrix.config.cross != true
        uses: actions/cache/restore@v6
        with:
          path: demotest/extract
          key: demotest-${{ hashFiles('demotest/config.toml') }}

      - name: Test
        if: matrix.config.cross != true
        run: |
          cd demotest
          python demotest --jobs 4 --port ../build/src/woof

      - name: Save demotest cache
        if: matrix.config.cross != true && steps.cache-demotest.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v6
        with:
          path: demotest/extract
          key: demotest-${{ hashFiles('demotest/config.toml') }}

      - name: Package
        run: |
          cd build
          cpack

      - name: Upload Artifacts
        if: matrix.config.artifact-path
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.artifact-name }}
          path: ${{ matrix.config.artifact-path }}

  macos-universal:
    name: macOS Universal
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: MacOS-*
          merge-multiple: false

      - name: Create Universal Binary and Package
        run: |
          set -euo pipefail

          echo "Downloaded artifacts:"
          find artifacts -maxdepth 2 -type f

          # Each artifact directory contains the CPack .zip
          unzip -q artifacts/MacOS-arm64/*.zip -d arm64
          unzip -q artifacts/MacOS-x64/*.zip   -d x64

          echo "Unpacked arm64:"
          ls -la arm64
          echo "Unpacked x64:"
          ls -la x64

          # CPack zips unpack into a "Woof-<version>/" directory
          lipo arm64/Woof-*/woof       x64/Woof-*/woof       -create -output woof
          lipo arm64/Woof-*/woof-setup x64/Woof-*/woof-setup -create -output woof-setup

          cp -R arm64/Woof-* universal
          mv -f woof       universal/woof
          mv -f woof-setup universal/woof-setup

          ( cd universal && zip -r ../woof-macos-universal.zip . )

      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MacOS-universal
          path: woof-macos-universal.zip

  release:
    name: Release
    needs: [build, macos-universal]
    if: contains(github.ref, 'tags')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract Version Number
        run: echo "VERSION=${GITHUB_REF##*_}" >> $GITHUB_ENV

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          name: Woof! ${{ env.VERSION }}
          bodyFile: CHANGELOG.md
          allowUpdates: true
          artifacts: artifacts/AppImage/*,artifacts/Win-64/*,artifacts/Win-32/*,artifacts/Linux-ARM64/*,artifacts/MacOS-universal/*
    